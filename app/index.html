<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12324a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="English" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Fill-in-the-blank practice, flashcards and grammar notes from your English study files." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="icon" href="./icons/icon-192.png" />
    <title>English Practice</title>
    <!--
      TTS (ResponsiveVoice) — optional.
      Set VITE_RESPONSIVEVOICE_KEY in .env.local (gitignored) or in Vercel env vars.
      Without a key the speak button will not produce sound.
    -->
    <script src="https://cdn.responsivevoice.org/sdk/latest/responsivevoice.js"></script>
    <script>
      if (window.responsiveVoice) {
        var rvKey = "%VITE_RESPONSIVEVOICE_KEY%";
        if (rvKey && rvKey !== "YOUR_KEY" && rvKey.indexOf("VITE_") === -1) {
          responsiveVoice.init({ "apiKey": rvKey });
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
